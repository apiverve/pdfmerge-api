name: apiverve_pdfmerge
description: "PDF Merge combines 2 to 10 PDFs into one file, keeping their order, and returns a download link valid for 2 days. Upload the files or send their URLs. Paid plans add a breakdown of where each source document starts and ends in the merged file."
version: 1.2.5
homepage: https://apiverve.com/marketplace/pdfmerge?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/pdfmerge-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
